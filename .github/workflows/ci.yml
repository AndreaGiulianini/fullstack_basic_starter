name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build:prod
        working-directory: app

  api:
    name: API — restore, build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No .NET SDK on the runner: the image is the build, exactly as in production.
      - run: docker build --target production -t api-ci ./api

  stack:
    name: Stack — smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        run: cp .env.placeholder .env
      - name: Start the stack
        run: docker compose -f compose.yaml -f compose_override/development.yaml up -d --build
      # EF Core migrations run on startup from Program.cs, so there is nothing to seed.
      - name: Smoke test
        run: bash smoke.sh
        env:
          API_PREFIX: /api/v1
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose_override/development.yaml logs --tail=200
